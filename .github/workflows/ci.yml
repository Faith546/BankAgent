name: CI — PEP 8 & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check PEP 8 formatting (ruff format)
        run: uv run ruff format --check src app tests

      - name: Check PEP 8 lint rules (ruff check)
        run: uv run ruff check src app tests

      - name: Run offline unit tests (no 193MB CSV required)
        run: >
          uv run pytest tests/test_db_reading.py tests/test_skills_and_guardrails.py -v
          -k "dictionary_loader or validate_readonly_sql or filter_validation
          or guardrail_verifies_numbers or langgraph_compiles"
